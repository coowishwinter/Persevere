<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="starCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#FEF08A" />
      <stop offset="40%" stopColor="#F59E0B" />
      <stop offset="85%" stopColor="#10B981" />
      <stop offset="100%" stopColor="#059669" />
    </radialGradient>
    <radialGradient id="starCorona" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#FDE047" stopOpacity="0.9" />
      <stop offset="50%" stopColor="#10B981" stopOpacity="0.5" />
      <stop offset="100%" stopColor="#10B981" stopOpacity="0" />
    </radialGradient>
    <linearGradient id="orbitGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#10B981" />
      <stop offset="50%" stopColor="#6EE7B7" />
      <stop offset="100%" stopColor="#3B82F6" />
    </linearGradient>
    <linearGradient id="orbitGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#F59E0B" />
      <stop offset="50%" stopColor="#10B981" />
      <stop offset="100%" stopColor="#8B5CF6" />
    </linearGradient>
  </defs>
  <!-- Background Disc -->
  <circle cx="50" cy="50" r="48" fill="#18181B" />
  <!-- Flare -->
  <circle cx="50" cy="50" r="38" fill="url(#starCorona)" />
  <!-- Orbits -->
  <ellipse cx="50" cy="50" rx="40" ry="16" stroke="url(#orbitGrad1)" stroke-width="2.5" transform="rotate(-25 50 50)" />
  <g transform="rotate(-25 50 50)">
    <circle cx="90" cy="50" r="4" fill="#10B981" />
    <circle cx="90" cy="50" r="1.5" fill="#FFFFFF" />
  </g>
  <ellipse cx="50" cy="50" rx="32" ry="12" stroke="url(#orbitGrad2)" stroke-width="2" transform="rotate(45 50 50)" />
  <g transform="rotate(45 50 50)">
    <circle cx="18" cy="50" r="3.5" fill="#F59E0B" />
    <circle cx="18" cy="50" r="1.2" fill="#FFFFFF" />
  </g>
  <!-- Star Rays -->
  <path d="M 50 20 L 53 45 L 80 50 L 53 55 L 50 80 L 47 55 L 20 50 L 47 45 Z" fill="#FEF08A" opacity="0.6" />
  <!-- Star Core -->
  <circle cx="50" cy="50" r="14" fill="url(#starCore)" />
  <circle cx="46" cy="46" r="4" fill="#FFFFFF" opacity="0.7" />
</svg>
